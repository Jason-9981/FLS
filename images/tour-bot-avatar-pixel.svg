<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" style="image-rendering:pixelated;shape-rendering:crispEdges;">
  <!-- Background CRT Tint -->
  <rect width="128" height="128" rx="20" fill="#f8eedb"/>
  
  <!-- Left Mascot (Big White Guy with Gamepad & Book) -->
  <!-- Gamepad on head -->
  <rect x="42" y="16" width="28" height="14" rx="4" fill="#cbd5e1" stroke="#1e293b" stroke-width="3"/>
  <rect x="48" y="20" width="4" height="6" fill="#1e293b"/>
  <rect x="47" y="21" width="6" height="4" fill="#1e293b"/>
  <circle cx="62" cy="21" r="1.5" fill="#ef4444"/>
  <circle cx="66" cy="24" r="1.5" fill="#3b82f6"/>
  <circle cx="58" cy="24" r="1.5" fill="#eab308"/>
  <circle cx="62" cy="27" r="1.5" fill="#22c55e"/>

  <!-- Body -->
  <path d="M 32 40 C 32 30, 80 30, 80 40 L 84 84 C 84 94, 28 94, 28 84 Z" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
  <!-- Eyes -->
  <rect x="44" y="44" width="4" height="5" fill="#1e293b"/>
  <rect x="64" y="44" width="4" height="5" fill="#1e293b"/>
  <!-- Blush -->
  <rect x="38" y="49" width="6" height="3" fill="#fda4af"/>
  <rect x="68" y="49" width="6" height="3" fill="#fda4af"/>
  <!-- Mouth -->
  <rect x="54" y="49" width="4" height="2" fill="#1e293b"/>
  <!-- Book in hands -->
  <polygon points="36,66 56,60 56,86 36,88" fill="#0284c7" stroke="#1e293b" stroke-width="3"/>
  <polygon points="56,60 76,66 76,88 56,86" fill="#38bdf8" stroke="#1e293b" stroke-width="3"/>
  <line x1="56" y1="60" x2="56" y2="86" stroke="#1e293b" stroke-width="3"/>
  <!-- Hands -->
  <ellipse cx="34" cy="74" rx="5" ry="6" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <ellipse cx="78" cy="74" rx="5" ry="6" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <!-- Feet -->
  <rect x="36" y="90" width="10" height="6" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <rect x="66" y="90" width="10" height="6" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>

  <!-- Right Mascot (Small Guy with Glasses) -->
  <ellipse cx="102" cy="72" rx="16" ry="18" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
  <!-- Glasses -->
  <circle cx="95" cy="68" r="6" fill="none" stroke="#1e293b" stroke-width="3"/>
  <circle cx="109" cy="68" r="6" fill="none" stroke="#1e293b" stroke-width="3"/>
  <line x1="101" y1="68" x2="103" y2="68" stroke="#1e293b" stroke-width="3"/>
  <!-- Eyes inside glasses -->
  <circle cx="95" cy="68" r="2" fill="#1e293b"/>
  <circle cx="109" cy="68" r="2" fill="#1e293b"/>
  <!-- Smile -->
  <path d="M 100 76 Q 102 78 104 76" stroke="#1e293b" stroke-width="2" fill="none"/>
  <!-- Small feet -->
  <rect x="94" y="90" width="6" height="4" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
  <rect x="104" y="90" width="6" height="4" rx="2" fill="#ffffff" stroke="#1e293b" stroke-width="3"/>
</svg>
