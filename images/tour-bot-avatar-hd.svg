<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f5fa"/>
      <stop offset="100%" stop-color="#e2ebf3"/>
    </linearGradient>
    <radialGradient id="body3d" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </radialGradient>
    <radialGradient id="bookGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="128" height="128" rx="24" fill="url(#skyGrad)"/>

  <!-- Left Big Character (Smooth 3D) -->
  <g filter="url(#softShadow)">
    <!-- Gamepad on head -->
    <rect x="42" y="16" width="28" height="14" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="48" cy="23" r="2.5" fill="#64748b"/>
    <circle cx="62" cy="20" r="1.5" fill="#ef4444"/>
    <circle cx="66" cy="23" r="1.5" fill="#3b82f6"/>
    <circle cx="58" cy="23" r="1.5" fill="#eab308"/>
    <circle cx="62" cy="26" r="1.5" fill="#22c55e"/>

    <!-- Pear shaped 3D Body -->
    <path d="M 32 44 C 32 28, 80 28, 80 44 C 88 64, 88 84, 80 92 C 72 98, 40 98, 32 92 C 24 84, 24 64, 32 44 Z" fill="url(#body3d)"/>
    
    <!-- Eyes -->
    <ellipse cx="45" cy="46" rx="2.5" ry="3.5" fill="#0f172a"/>
    <ellipse cx="67" cy="46" rx="2.5" ry="3.5" fill="#0f172a"/>
    <circle cx="46" cy="44.5" r="1" fill="#ffffff"/>
    <circle cx="68" cy="44.5" r="1" fill="#ffffff"/>

    <!-- Cute Blush -->
    <ellipse cx="38" cy="52" rx="4" ry="2.5" fill="#fda4af" opacity="0.6"/>
    <ellipse cx="74" cy="52" rx="4" ry="2.5" fill="#fda4af" opacity="0.6"/>

    <!-- Smile -->
    <path d="M 54 51 Q 56 53.5 58 51" stroke="#334155" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Book in 3D -->
    <path d="M 35 68 L 56 62 L 77 68 L 77 88 L 56 83 L 35 88 Z" fill="url(#bookGrad)"/>
    <path d="M 56 62 L 56 83" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>

    <!-- Hands -->
    <ellipse cx="34" cy="74" rx="5" ry="6" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="78" cy="74" rx="5" ry="6" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Right Small Character with Glasses (Smooth 3D) -->
  <g filter="url(#softShadow)">
    <ellipse cx="102" cy="74" rx="16" ry="19" fill="url(#body3d)"/>
    <!-- Glasses Frames -->
    <circle cx="95" cy="69" r="6" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <circle cx="109" cy="69" r="6" fill="none" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="101" y1="69" x2="103" y2="69" stroke="#0f172a" stroke-width="2.5"/>
    <!-- Glasses bridge to ear -->
    <path d="M 115 69 L 118 68" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Eyes -->
    <circle cx="95" cy="69" r="2.2" fill="#0f172a"/>
    <circle cx="109" cy="69" r="2.2" fill="#0f172a"/>
    <circle cx="96" cy="68" r="0.8" fill="#ffffff"/>
    <circle cx="110" cy="68" r="0.8" fill="#ffffff"/>

    <!-- Cute Smile -->
    <path d="M 100 78 Q 102 80.5 104 78" stroke="#334155" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
